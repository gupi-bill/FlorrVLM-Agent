# FlorrVLM-Agent 全局配置 config.yaml
# 所有阈值/路径集中在这里，改参数不用改源码。
# 改完保存即热加载生效（agent_main 每轮会检测文件变化）。
# 这些是 Florr 专属部分：1.0 之后整份可作为第一张"游戏档案"抽走。

server:
  perception_port: 5001        # 感知服务端口
  panel_port: 5002             # 本地面板端口

predictor:
  predict_seconds: 1.2         # 预判未来秒数
  min_frames: 3                # 至少多少帧才算速度
  entity_timeout: 0.4          # 实体消失后保留秒数（抗漏检抖动）
  max_output_entities: 8       # 最多输出前 N 个威胁最高实体
  history_maxlen: 10           # 每个实体保留帧数
  confidence_threshold: 0.65   # 置信度阈值锁
  rarity_highest_boss: ["Unique", "Eternal"]
  rarity_boss: ["Super"]
  rarity_elite: ["Ultra", "Mythic", "Legendary", "Epic"]
  rarity_normal: ["Rare", "Unusual", "Common"]
  threat:
    highest_boss: 1000
    boss: 400
    elite: 120
    normal: 15
    player_enemy: 150
    player_ally: 0
    unknown: 5

combat:
  eval_debounce_interval: 0.7
  jitter_base: 8
  jitter_max: 15
  chase_max_distance: 400
  chase_min_category: elite
  safe_zone_margin: 100
  safe_zone_w: 1920
  safe_zone_h: 1080

agent:
  game: florr
  use_ai: true                # true=调 LLM/VLM API 决策; false=纯本地规则决策(离线免费)
  loop_interval: 0.5
  webhook_url: ""
  death_frame_threshold: 8
  boss_memory_interval: 12
  boss_sample_max: 120
  boss_close_dist: 120
  learning_stats_interval: 24
  report_every: 0

mcp:
  streamable_http: false
  streamable_port: 5050

paths:
  knowledge_md: knowledge_md
  frames: video_frames
  run_logs: run_logs

logs:
  retention_days: 7
  max_size_mb: 20

resource:
  enabled: true
  check_interval: 30
  mem_limit_mb: 500
  cpu_limit_pct: 80
  mem_hard_mb: 1000
